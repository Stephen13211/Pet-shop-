<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Admin — Paws Incorporated
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="stylesheet"
    href="auth-pages.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script
    defer
    src="auth.js"
  ></script>

</head>

<body class="auth-page">

  <nav class="auth-shell auth-nav">

    <a
      class="brand"
      href="index.html"
    >

      <img
        src="garfield-odie.jpg"
        alt="Garfield and Odie"
      >

      <span>
        paws incorporated
      </span>

    </a>

    <div>

      <a href="index.html">
        View store
      </a>

      <button
        class="text-button"
        id="admin-sign-out"
      >
        Sign out
      </button>

    </div>

  </nav>

  <main class="auth-shell admin-page">

    <p class="eyebrow-text">
      Private workspace
    </p>

    <h1>
      Store admin
    </h1>

    <div class="admin-grid">

      <section class="dashboard-card">

        <h3>
          Add product
        </h3>

        <form
          id="product-form"
          class="auth-form"
        >

          <label>

            Product name

            <input
              name="name"
              required
            >

          </label>

          <label>

            Description

            <textarea
              name="description"
              rows="3"
            ></textarea>

          </label>

          <label>

            Price in rand

            <input
              name="price"
              type="number"
              min="0"
              step="0.01"
              required
            >

          </label>

          <label>

            Image URL

            <input
              name="imageUrl"
              type="url"
            >

          </label>

          <label>

            Category

            <input
              name="category"
              value="Care"
            >

          </label>

          <button
            class="button primary"
            type="submit"
          >
            Add product
          </button>

        </form>

        <p
          class="auth-message"
          id="admin-message"
        ></p>

      </section>

      <section class="dashboard-card">

        <h3>
          Products
        </h3>

        <div
          class="admin-products"
          id="admin-products"
        >
          Loading...
        </div>

      </section>

    </div>

    <section
      class="dashboard-card admin-orders"
    >

      <h3>
        Orders
      </h3>

      <div
        class="data-list"
        id="admin-orders"
      >
        Loading...
      </div>

    </section>

  </main>

</body>

</html>
